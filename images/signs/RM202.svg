<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Asphalt Road Base -->
  <rect width="200" height="300" fill="#1e1e1e" />

  <!-- Road Surface Texture Lines (Subtle Lanes) -->
  <line x1="120" y1="0" x2="120" y2="300" stroke="#333333" stroke-width="2" stroke-dasharray="20,20" />

  <!-- Curb / Sidewalk Boundary (Left Edge) -->
  <rect x="0" y="0" width="30" height="300" fill="#7f8c8d" />
  <rect x="25" y="0" width="5" height="300" fill="#bdc3c7" />

  <!-- RM202 Solid Yellow Line Painted Along Curb/Edge -->
  <rect x="30" y="0" width="12" height="300" fill="#FFCC00" />

  <!-- Marking Label overlay -->
  <rect x="50" y="240" width="145" height="45" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="122" y="258" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RM202</text>
  <text x="122" y="274" fill="#FFCC00" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NO PARKING</text>
</svg>
