<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">K53 Mini-Roundabout: Give Way to the Right</title>
<desc id="d">Vehicle B from the south stops at the yield line while Vehicle A from the east circulates clockwise past the south approach. Once clear, Vehicle B proceeds.</desc>
<defs>
<clipPath id="c"><rect width="800" height="600"/></clipPath>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<marker id="ah" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0L6 3 0 6z" fill="#fff"/></marker>
<!-- Car faces +x so rotate="auto" points it along its path -->
<g id="car">
<rect x="-30" y="-18" width="60" height="36" rx="9"/>
<rect x="4" y="-13" width="12" height="26" rx="3" fill="#0f172a" opacity=".75"/>
<rect x="-22" y="-12" width="7" height="24" rx="2" fill="#0f172a" opacity=".6"/>
<circle cx="28" cy="-11" r="3" fill="#fef08a"/><circle cx="28" cy="11" r="3" fill="#fef08a"/>
<rect x="-31" y="-15" width="3" height="8" fill="#7f1d1d"/><rect x="-31" y="7" width="3" height="8" fill="#7f1d1d"/>
</g>
<!-- A: East lane (westbound, left side) -> clockwise round the island -> West exit -->
<path id="pA" d="M860 340H500Q470 340 442.85 342A60 60 0 0 1 357.15 342Q330 340 300 340H-60"/>
<!-- B: South lane (northbound, left side) -> stops at RM2 -> turns left, West exit -->
<path id="pB" d="M360 640V372C360 352 345 340 318 340H-60"/>
</defs>

<g clip-path="url(#c)" font-family="system-ui,Segoe UI,Arial,sans-serif">
<rect width="800" height="600" fill="#36513a"/>

<!-- Roads: 2 lanes each way, lane centres 40px from the centre line -->
<rect x="320" width="160" height="600" fill="#3b4656"/>
<rect y="220" width="800" height="160" fill="#3b4656"/>
<circle cx="400" cy="300" r="80" fill="#3b4656"/>
<g stroke="#e2e8f0" stroke-width="2" fill="none">
<path d="M324 0V216M476 0V216M324 384V600M476 384V600M0 224H316M0 376H316M484 224H800M484 376H800"/>
</g>
<g stroke="#fff" stroke-width="3" stroke-dasharray="18 14" fill="none" opacity=".8">
<path d="M400 0V218M400 382V600M0 300H218M582 300H800"/>
</g>

<!-- RM2 transverse broken yield lines at each entrance (entering lane only) -->
<g stroke="#fff" stroke-width="5" stroke-dasharray="10 8" fill="none">
<path d="M322 392H398"/><path d="M492 302V378"/><path d="M402 208H478"/><path d="M308 222V298"/>
</g>

<!-- Central island, kerb, R2.1 yield sign, RM15 clockwise arrows -->
<circle cx="400" cy="300" r="34" fill="#f59e0b"/>
<circle cx="400" cy="300" r="30" fill="#15803d" stroke="#e2e8f0" stroke-width="2"/>
<polygon transform="translate(400 302) scale(.8)" points="-18,-14 18,-14 0,18" fill="#fff" stroke="#dc2626" stroke-width="6" stroke-linejoin="round"/>
<g stroke="#fff" stroke-width="4" fill="none" marker-end="url(#ah)">
<path d="M418.6 260.1A44 44 0 0 1 439.9 281.4"/>
<path d="M439.9 318.6A44 44 0 0 1 418.6 339.9"/>
<path d="M381.4 339.9A44 44 0 0 1 360.1 318.6"/>
<path d="M360.1 281.4A44 44 0 0 1 381.4 260.1"/>
</g>

<!-- Direction labels -->
<g font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">
<g fill="#0f172a" stroke="#475569"><rect x="372" y="72" width="56" height="20" rx="10"/><rect x="372" y="508" width="56" height="20" rx="10"/><rect x="730" y="290" width="56" height="20" rx="10"/><rect x="14" y="290" width="56" height="20" rx="10"/></g>
<text x="400" y="86" stroke="none">NORTH</text><text x="400" y="522">SOUTH</text><text x="758" y="304">EAST</text><text x="42" y="304">WEST</text>
</g>

<!-- Legend -->
<g font-size="12" fill="#e2e8f0">
<rect x="20" y="78" width="22" height="12" rx="4" fill="#dc2626"/><text x="50" y="89">A – from the RIGHT (priority)</text>
<rect x="20" y="100" width="22" height="12" rx="4" fill="#2563eb"/><text x="50" y="111">B – student driver (gives way)</text>
</g>

<!-- Pulsing red stop zone (South approach) while A approaches / crosses -->
<g opacity="0">
<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.125;.4;1" values="0;1;0;0" dur="16s" repeatCount="indefinite"/>
<rect x="322" y="396" width="76" height="72" rx="6" fill="#ef4444" stroke="#fecaca" stroke-width="2" stroke-dasharray="6 4">
<animate attributeName="fill-opacity" values=".15;.55;.15" dur=".9s" repeatCount="indefinite"/></rect>
<circle cx="270" cy="400" r="18" fill="#dc2626"><animate attributeName="opacity" values=".5;1;.5" dur=".9s" repeatCount="indefinite"/></circle>
<text x="270" y="407" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">!</text>
<text x="300" y="438" font-size="15" font-weight="800" fill="#fca5a5" text-anchor="end">STOP – GIVE WAY</text>
<text x="300" y="454" font-size="11" fill="#fecaca" text-anchor="end">Vehicle A has right of way</text>
</g>

<!-- Green safe-to-proceed overlay once A has cleared the conflict point -->
<g opacity="0">
<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.4;.594;1" values="0;1;0;0" dur="16s" repeatCount="indefinite"/>
<rect x="322" y="396" width="76" height="72" rx="6" fill="#22c55e" fill-opacity=".25" stroke="#bbf7d0" stroke-width="2"/>
<circle cx="270" cy="400" r="18" fill="#16a34a"/>
<path d="M261 400l6 7 12-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="438" font-size="15" font-weight="800" fill="#86efac" text-anchor="end">SAFE TO PROCEED</text>
<text x="300" y="454" font-size="11" fill="#bbf7d0" text-anchor="end">Vehicle A has cleared the path</text>
</g>

<!-- Vehicle A (red): from the East, clockwise, never stops -->
<g>
<use href="#car" fill="#dc2626"/>
<animateMotion dur="16s" repeatCount="indefinite" rotate="auto" keyTimes="0;.6;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#pA"/></animateMotion>
</g>
<!-- Vehicle B (blue): stops behind RM2, waits, then proceeds -->
<g>
<use href="#car" fill="#2563eb"/>
<g fill="#ff3b3b"><rect x="-32" y="-16" width="5" height="10"/><rect x="-32" y="6" width="5" height="10"/>
<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.125;.4375;1" values="0;1;0;0" dur="16s" repeatCount="indefinite"/></g>
<animateMotion dur="16s" repeatCount="indefinite" rotate="auto" calcMode="linear"
keyTimes="0;.125;.2;.4125;.475;.725;1" keyPoints="0;.198;.2946;.2946;.337;1;1"><mpath href="#pB"/></animateMotion>
</g>
<!-- Upright A / B tags that follow the cars -->
<g font-size="12" font-weight="800" text-anchor="middle" fill="#fff">
<g><g transform="translate(0 -34)"><circle r="10" fill="#7f1d1d"/><text y="4">A</text></g>
<animateMotion dur="16s" repeatCount="indefinite" keyTimes="0;.6;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#pA"/></animateMotion></g>
<g><g transform="translate(0 -34)"><circle r="10" fill="#1e3a8a"/><text y="4">B</text></g>
<animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;.125;.2;.4125;.475;.725;1" keyPoints="0;.198;.2946;.2946;.337;1;1"><mpath href="#pB"/></animateMotion></g>
</g>

<!-- Top banner: glowing GIVE WAY TO RIGHT -->
<rect x="150" y="8" width="500" height="56" rx="12" fill="#f59e0b" filter="url(#gl)" opacity=".5">
<animate attributeName="opacity" values=".25;.8;.25" dur="1.6s" repeatCount="indefinite"/></rect>
<rect x="150" y="8" width="500" height="56" rx="12" fill="#7c2d12" stroke="#fbbf24" stroke-width="2.5"/>
<text x="400" y="37" font-size="26" font-weight="900" fill="#fff7ed" text-anchor="middle" letter-spacing="2">GIVE WAY TO RIGHT</text>
<text x="400" y="55" font-size="11" fill="#fde68a" text-anchor="middle">K53 mini-roundabout · yield to traffic in the circle or approaching from the right</text>

<!-- Step captions -->
<rect x="20" y="548" width="760" height="38" rx="8" fill="#0f172a" fill-opacity=".9"/>
<g font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">
<text x="400" y="572" opacity="0">B approaches the South yield line (RM2) – check right<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.175;1" values="1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="400" y="572" opacity="0">Step 1 · B STOPS behind the yield line – A is coming from the RIGHT<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.175;.3125;1" values="0;1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="400" y="572" opacity="0">Step 2 · A has right of way and passes the South approach<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.3125;.4125;1" values="0;1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="400" y="572" opacity="0">Step 3 · Path clear – B proceeds into the circle and turns left<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.4125;.725;1" values="0;1;0;0" dur="16s" repeatCount="indefinite"/></text>
<text x="400" y="572" opacity="0">Rule: give way to the right, then go only when it is clear<animate attributeName="opacity" calcMode="discrete" keyTimes="0;.725;1" values="0;1;1" dur="16s" repeatCount="indefinite"/></text>
</g>
</g>
</svg>
