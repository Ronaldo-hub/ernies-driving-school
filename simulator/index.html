<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K53 Interactive Demo Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="demo-card" id="quiz-card">
      <div class="card-header">
        <span class="q-meta" id="q-counter">LOADING...</span>
      </div>

      <div class="svg-container" id="svg-container">
        <!-- Wordless SVG Injected Here -->
      </div>

      <div class="q-text" id="q-text">Initializing Question Bank...</div>

      <div class="options-container" id="options-container">
        <!-- Options Injected Here -->
      </div>

      <div class="feedback-panel" id="feedback-panel"></div>

      <div class="nav-buttons">
        <button class="nav-btn btn-secondary" onclick="app.prev()">&#9664; PREV</button>
        <button class="nav-btn btn-primary" id="next-btn" onclick="app.next()">NEXT &#9654;</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
