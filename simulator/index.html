<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K53 Interactive Demo - Ernie's Driving School</title>
  <style>
    body { margin: 0; padding: 40px 20px; font-family: system-ui, sans-serif; background: #0F172A; color: #F8FAFC; display: flex; flex-direction: column; align-items: center; }
    .section-title { text-align: center; margin-bottom: 30px; }
    .section-title h2 { font-size: 2rem; text-transform: uppercase; margin: 0 0 10px 0; }
    .section-title p { color: #94A3B8; margin: 0; }

    .demo-card { background: #1E293B; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 800px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .canvas-container { background: #020617; border-bottom: 2px solid #334155; position: relative; }
    canvas { display: block; width: 100%; height: 250px; }

    .quiz-body { padding: 30px; }
    .question-category { color: #EF4444; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
    .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 24px; line-height: 1.5; }

    .options-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .option-btn { padding: 16px; background: #0F172A; border: 1px solid #334155; color: white; text-align: left; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .option-btn:hover { background: #1e293b; border-color: #EF4444; }
    .option-btn.selected { border-color: #EF4444; background: rgba(239, 68, 68, 0.1); }

    .feedback { padding: 16px; border-radius: 6px; margin-bottom: 24px; font-weight: 500; display: none; }
    .feedback.correct { background: rgba(16, 185, 129, 0.1); border: 1px solid #10B981; color: #34D399; display: block; }
    .feedback.incorrect { background: rgba(239, 68, 68, 0.1); border: 1px solid #EF4444; color: #FCA5A5; display: block; }

    .controls { display: flex; gap: 16px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; text-transform: uppercase; transition: 0.2s; }
    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-primary { background: #EF4444; color: white; }
    .btn-primary:hover { background: #DC2626; }
  </style>
</head>
<body>
  <div class="section-title">
    <h2>Interactive K53 Demo Test</h2>
    <p>Test your knowledge on key South African road signs and rules of the road</p>
  </div>

  <div class="demo-card">
    <div class="canvas-container">
      <canvas id="simulationCanvas" width="800" height="250"></canvas>
    </div>

    <div class="quiz-body">
      <div id="questionCounter" class="question-category">LOADING...</div>
      <div id="questionText" class="question-text">Initializing Question Bank...</div>

      <div id="optionsContainer" class="options-group"></div>
      <div id="feedbackPanel" class="feedback"></div>

      <div class="controls">
        <button class="btn btn-secondary" onclick="app.prev()">◄ Prev</button>
        <button class="btn btn-primary" onclick="app.next()">Next ►</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
