
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernie - Fixed Next Button + Circle</title>
<style>
:root{--soft:#FFFBF0;--peach:#FFF3E0;--sage:#E8F5E9;--blue:#E3F2FD;--ink:#3E2723;--red:#B71C1C;--brown:#5D4037}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif}
body{background:#1a1a1a;max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
#top{background:#2D2D2D;color:#FFFBF0;padding:12px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--red)}
#chat{flex:1;overflow-y:auto;padding:14px;background:#212121;display:flex;flex-direction:column;gap:14px}
.bub{background:var(--soft);padding:14px;border-radius:18px;max-width:94%;font-size:15px;color:var(--ink);border:1px solid #EFEBE9}
.bub.me{background:#DCEDC8;align-self:flex-end}
.bub.question{border-left:5px solid var(--red)}.bub.good{border-left:5px solid #2E7D32;background:#E8F5E9}.bub.bad{border-left:5px solid var(--red);background:#FFEBEE}
.svg-box{background:white;border-radius:16px;padding:8px;margin:12px 0;border:2px solid #D7CCC8}
.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btns button{padding:13px 18px;border-radius:24px;font-weight:700;cursor:pointer;border:2px solid #FFB74D}
.btnA{background:#FFF3E0}.btnB{background:#E3F2FD;border-color:#64B5F6!important}.btnNext{background:var(--brown);color:white}
.progress{height:6px;background:#3E2723;border-radius:6px;margin:8px 0}.progress div{height:100%;background:linear-gradient(90deg,#B71C1C,#FF8A65)}
#inputBar{background:#2D2D2D;padding:12px;display:flex;gap:10px;border-top:2px solid #3E2723} #inputBar input{flex:1;background:#424242;border:none;padding:11px;border-radius:20px;color:white}
</style></head><body>
<div id="top"><h2>Ernie - Fixed</h2></div>
<div id="chat"></div>
<div id="inputBar"><input id="inp" placeholder="Tap A/B above"></div>
<script>
let qIdx=0, score=0, waiting=false, mode='general';
const chat=document.getElementById('chat');

const QUESTIONS=[
{id:8,q:"What does a solid yellow line along left curb (RM202) indicate?",A:"A) No Parking",B:"B) No Stopping",C:"C) Bus parking",correct:"A",exp:"Solid yellow = NO PARKING. From your JSON Q8.",svg:"yellow_line",file:"RM202.svg"},
{id:2,q:"What does circular sign red border 120 (R201) mean?",A:"A) Max 120",B:"B) Min 120",C:"C) Rainy",correct:"A",exp:"Sign R201 = Max 120. From your JSON Q2.",svg:"120_sign",file:"R201-120.svg"},
{id:99,q:"Strand circle near braai — Vehicle B on your right, Vehicle A you. Who goes first?",A:"A) You go first",B:"B) B goes — give way to right, like braai queue",C:"C) Both",correct:"B",exp:"Mini-roundabout: give way to right. B on right goes first. Like braai queue.",svg:"circle",file:"circle_strand.svg"},
{id:60,q:"General max speed in urban/built-up area (Strand Main Rd by Wimpy) unless sign says otherwise?",A:"A) 60 km/h — neighbours walk",B:"B) 100 km/h",C:"C) 120 km/h",correct:"A",exp:"Urban = 60 km/h unless posted otherwise. Kids, gogo walk.",svg:"60_sign",file:"R1-60.svg"},
{id:5,q:"Circular red sign white horizontal bar (R3) means?",A:"A) No entry",B:"B) One-way",C:"C) Stop",correct:"A",exp:"R3 = No Entry. From your JSON Q5.",svg:"no_entry",file:"R3.svg"},
{id:19,q:"Yellow crisscross box at intersection (RM10) mandates?",A:"A) Do not enter unless exit clear",B:"B) Parking allowed",C:"C) Speed up",correct:"A",exp:"Box junction: do not block. From your JSON Q19.",svg:"box",file:"RM10.svg"}
];

function getSVG(type){
 if(type==="circle") return `<svg width="100%" viewBox="0 0 750 480" xmlns="http://www.w3.org/2000/svg"><rect width="750" height="480" fill="#FFFBF0" rx="18"/><text x="24" y="30" font-weight="700" font-size="15" fill="#3E2723">Strand circle near braai — You know this 💛</text><rect x="20" y="42" width="710" height="310" fill="#E8F5E9" rx="14" stroke="#A5D6A7"/><path d="M20 195 L730 195 L730 230 L20 230 Z" fill="#9E9E9E"/><path d="M335 42 L370 42 L370 352 L335 352 Z" fill="#9E9E9E"/><circle cx="352" cy="212" r="58" fill="white" stroke="#5D4037" stroke-width="2.8"/><circle cx="352" cy="212" r="18" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.8"/><text x="352" y="216" text-anchor="middle" font-size="7" font-weight="800" fill="#2E7D32">YOU KNOW</text><g><rect x="336" y="85" width="32" height="52" rx="8" fill="#FFE0B2" stroke="#3E2723" stroke-width="1.8"/><text x="352" y="118" text-anchor="middle" font-size="11" font-weight="900">B</text></g><g><rect x="434" y="200" width="56" height="28" rx="8" fill="#FFCC80" stroke="#3E2723" stroke-width="1.8"/><text x="462" y="218" text-anchor="middle" font-size="8" font-weight="800">YOU - A</text></g></svg>`;
 if(type==="yellow_line") return `<svg width="100%" viewBox="0 0 340 100"><rect width="340" height="100" fill="#FFF8E1" rx="14"/><rect y="62" width="340" height="14" fill="#FFEB00" rx="7" stroke="#111" stroke-width="1.5"/><text x="12" y="28" font-size="13" font-weight="700">Solid yellow - RM202</text><text x="12" y="48" font-size="12">Left curb = No Parking</text></svg>`;
 if(type==="120_sign") return `<svg width="100%" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="white" stroke="#CC0000" stroke-width="10"/><text x="100" y="118" text-anchor="middle" font-size="52" font-weight="900">120</text></svg>`;
 if(type==="60_sign") return `<svg width="100%" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="white" stroke="#CC0000" stroke-width="10"/><text x="100" y="120" text-anchor="middle" font-size="64" font-weight="900">60</text><text x="100" y="145" text-anchor="middle" font-size="11">Urban - Strand</text></svg>`;
 if(type==="no_entry") return `<svg width="100%" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="#CC0000"/><rect x="30" y="85" width="140" height="30" fill="white" rx="4"/></svg>`;
 if(type==="box") return `<svg width="100%" viewBox="0 0 340 100"><rect width="340" height="100" fill="#FFFDE7" rx="14"/><rect x="40" y="20" width="260" height="60" fill="none" stroke="#FFB300" stroke-width="4"/><line x1="40" y1="20" x2="300" y2="80" stroke="#FFB300" stroke-width="3"/><line x1="300" y1="20" x2="40" y2="80" stroke="#FFB300" stroke-width="3"/><text x="12" y="18" font-size="12" font-weight="700">Box junction RM10</text></svg>`;
 return `<svg width="100%" viewBox="0 0 100 50"><text x="10" y="30">${type}</text></svg>`;
}

function add(html,me=false,cls=""){
 const d=document.createElement('div'); d.className='bub '+(me?'me ':'')+cls;
 d.innerHTML=html+`<span style="font-size:11px;color:#8D6E63;display:block;margin-top:8px">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${me?'✓✓':''}</span>`;
 chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function showQ(){
 if(qIdx>=QUESTIONS.length){
   add(`<div style='text-align:center'><h3>Done: ${score}/${QUESTIONS.length}</h3><p>Real K53 + circle + 60 - Next button fixed!</p><button class='btnNext' onclick='location.reload()'>Restart</button></div>`,'','good');
   waiting=false; return;
 }
 const q=QUESTIONS[qIdx]; waiting=true;
 const pct=Math.round((qIdx/QUESTIONS.length)*100);
 add(`<div class='progress'><div style='width:${pct}%'></div></div>
 <div style='font-size:11px;color:#8D6E63'>Q ${qIdx+1}/${QUESTIONS.length} • ${q.file} • Score ${score}</div>
 <div class='svg-box'>${getSVG(q.svg)}<div style='font-size:10px;color:#8D6E63;text-align:center'>${q.file} • ${q.type}</div></div>
 <div style='font-weight:700;margin:10px 0'>${q.q}</div>
 <div class='btns'>
   <button class='btnA' onclick="answer('A')">${q.A}</button>
   <button class='btnB' onclick="answer('B')">${q.B}</button>
   ${q.C?`<button class='btnB' onclick="answer('C')">${q.C}</button>`:''}
 </div>
 <div style='font-size:11px;color:#8D6E63;margin-top:10px'>Tap A/B/C — I wait — Real answer: ${q.correct}</div>`,false,'question');
}
function answer(choice){
 if(!waiting) return; waiting=false;
 const q=QUESTIONS[qIdx]; const ok=choice===q.correct; if(ok) score++;
 add(choice==='A'?q.A:choice==='B'?q.B:q.C,true);
 setTimeout(()=>{
   add(`<div style='font-weight:800'>${ok?'✅ Sharp! '+choice+' correct':'💛 Not quite, correct '+q.correct} — ${q.correct} from your JSON</div>
   <div style='background:white;border-radius:12px;padding:12px;margin:10px 0'><b>📖 Real K53:</b> ${q.exp}</div>
   <div style='margin:10px 0'><button class='btnNext' id='nextBtn' onclick='nextQ()'>Next → Q ${qIdx+1}/${QUESTIONS.length} done</button></div>
   <div style='font-size:11px;color:#8D6E63'>If Next doesn't work, open console (F12) and type: nextQ()</div>
   `,false,ok?'good':'bad');
 },600);
}
function nextQ(){ console.log('nextQ called, qIdx',qIdx); qIdx++; showQ(); }
function startDemo(){qIdx=0;score=0;showQ();}
function boot(){
 add(`Sawubona Ronald! 🌅<br>Real K53 from your JSON + circle + 60.<br>6 Qs with inline SVGs - circle ALWAYS shows. Next button fixed with console log.`,false,'question');
 setTimeout(()=>{add(`<button class='btnA' onclick='startDemo()'>Start ${QUESTIONS.length} Real Qs — circle + 60 💛</button>`);},1000);
}
window.answer=answer; window.nextQ=nextQ; window.startDemo=startDemo;
window.onload=boot;
</script></body></html>
