<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernie's Driving School - Moya Datafree</title>
<style>
:root{--ernie-red:#CC0000;--ernie-black:#111;--ernie-yellow:#FFEB00;}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Roboto,Arial;}
body{background:#111111;max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden;border-left:4px solid var(--ernie-red);border-right:4px solid var(--ernie-yellow);}
#top{background:var(--ernie-black);color:white;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ernie-red);}
#top .back{font-size:22px;color:white;}#top .ava{width:40px;height:40px;background:white;border:2px solid var(--ernie-red);border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#top .ava img{width:100%;height:100%;object-fit:contain;}#top h2{flex:1;font-size:14px;font-weight:900;color:white;}#top .ic{font-size:20px;color:white;margin-left:8px;}
#chat{flex:1;overflow-y:auto;padding:12px;background:#111111;display:flex;flex-direction:column;gap:10px;}
.bub{background:white;padding:12px 14px;border-radius:14px;max-width:88%;font-size:14.8px;line-height:1.45;box-shadow:0 2px 8px rgba(204,0,0,0.3);color:#111;align-self:flex-start;animation:pop .3s ease;border-left:5px solid var(--ernie-red);}
.bub.me{background:#DCF8C6;align-self:flex-end;border-left:5px solid #25D366;}
.bub.ernie-red{border-left:5px solid var(--ernie-yellow);background:#FFF5F5;}
.bub .time{font-size:11px;color:#666;margin-top:6px;display:block;}
.svg-box{background:white;border:3px solid var(--ernie-red);border-radius:12px;padding:12px;margin:10px 0;box-shadow:4px 4px 0 var(--ernie-black);}
.hl{background:var(--ernie-yellow);padding:3px 7px;border-radius:4px;font-weight:900;border:1px solid var(--ernie-black);}
.hl-red{background:var(--ernie-red);color:white;padding:3px 7px;border-radius:4px;font-weight:900;}
.sarc{font-style:italic;background:#FFF8E1;padding:8px 10px;border-left:4px solid var(--ernie-red);margin:8px 0;border-radius:0 10px 10px 0;}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.btns button{background:var(--ernie-red);color:white;border:2px solid var(--ernie-red);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;}
.btns button.black{background:var(--ernie-black);color:var(--ernie-yellow);border-color:var(--ernie-black);}
.poster{background:linear-gradient(135deg,#fff 0%,#FFEB00 100%);border:3px solid var(--ernie-red);border-radius:12px;padding:10px;margin:8px 0;text-align:center;}
#inputBar{background:#222;padding:10px 12px;display:flex;align-items:center;gap:10px;border-top:3px solid var(--ernie-red);}
#inputBar input{flex:1;border:none;outline:none;font-size:15px;padding:8px;font-weight:600;background:transparent;color:white;}
#inputBar input::placeholder{color:#888;}
.icon{font-size:24px;color:white;}
@keyframes pop{0%{transform:scale(.92) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.path-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s ease forwards;}
</style>
</head>
<body>
<div id="top"><span class="back">←</span><div class="ava"><img src="./images/logo.png" alt="Ernie" onerror="this.parentElement.innerHTML='🚗'"></div><h2>Ernie from Driving School</h2><span class="ic">🔍</span><span class="ic">⋮</span></div>
<div id="chat"></div>
<div id="inputBar"><span class="icon">☺</span><input id="inp" placeholder="Type Hi, 27, Got it..."><span class="icon">📎</span><span class="icon">🎤</span></div>
<script>
const chat=document.getElementById('chat');const inp=document.getElementById('inp');
const STORIES={
"27":{title:"Q27: Solid Yellow Line",q:"Solid yellow line means? A) Park for vetkoek B) NO parking / NO stopping",diy:"ROPE KNOT: Tie yellow shoelace on door. Pull knot and say 'Yellow = No park'",why:"Yellow is for emergency, taxi, ambulance.",sarc:"Cousin says 'just 2 minutes' - officer says 'just R500 fine, 2 minutes to write it'.",svg:`<svg viewBox="0 0 320 90"><rect width="320" height="90" fill="#222"/><line x1="0" y1="65" x2="320" y2="65" stroke="#FFEB00" stroke-width="8" class="path-draw"/><text x="10" y="25" fill="white" font-size="11" font-weight="800">YELLOW LINE = KEEP CLEAR</text><rect x="220" y="15" width="80" height="30" rx="6" fill="#CC0000"/><text x="230" y="33" fill="white" font-size="11" font-weight="900">NO PARK!</text></svg>`,poster:"Make A4: Draw yellow line, write 'YELLOW = NO STOP'. Stick on fridge."},
"45":{title:"Q45: Stop Sign 8 Sides",q:"How many sides? Most fail this!",diy:"CARDBOARD STOP: Cut octagon (8 sides) from box. Write STOP red. Count 1-8 every morning",why:"8 sides so you know STOP even when mud covers word.",sarc:"Cousin says Stop is 'suggestion'. Cousin failed 3 times.",svg:`<svg viewBox="0 0 200 130"><polygon points="100,10 150,30 150,85 100,105 50,85 50,30" fill="#CC0000" stroke="#111" stroke-width="4" class="path-draw"/><text x="100" y="68" text-anchor="middle" fill="white" font-weight="900" font-size="24">STOP</text><text x="100" y="122" text-anchor="middle" font-size="10" font-weight="800">8 SIDES - COUNT!</text></svg>`,poster:"Mindmap: Draw 8 arrows from STOP, each = 1 side."},
"10":{title:"Q10: Robot Red+Yellow",q:"Robot Red+Yellow together = ?",diy:"3 CUPS: Red=STOP, Red+Yellow=READY, Green=GO.",why:"Red+Yellow = Taxi saying 'Sharp, I'm about to go!' Get ready.",sarc:"Not 'rev engine and check Facebook'.",svg:`<svg viewBox="0 0 180 110"><rect x="60" width="60" height="100" rx="12" fill="#111"/><circle cx="90" cy="25" r="13" fill="#CC0000"/><circle cx="90" cy="52" r="13" fill="#FFEB00" stroke="white" stroke-width="3" class="path-draw"/><circle cx="90" cy="79" r="13" fill="#333"/></svg>`,poster:"Poster: Draw traffic light, label Red=Stop, Red+Yellow=Ready, Green=Go."}
};
function add(text,me=false,extra=""){const d=document.createElement('div');d.className='bub'+(me?' me':'')+' '+extra;const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.innerHTML=text+`<span class="time">${t}${me?' ✓✓':''}</span>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function addStory(id){const s=STORIES[id]||STORIES["27"];add(`<span class="hl-red">${s.title}</span><div class="svg-box">${s.svg}</div><span class="hl">${s.q}</span>`);setTimeout(()=>{add(`<strong>DIY with hands (no car):</strong><br>${s.diy}<div class="poster"><h4>🖼️ POSTER / MINDMAP (R0 or R20)</h4><div style="font-size:12px;">${s.poster}<br>Make FREE with sugar paper, or buy printed at Shoprite R20</div></div><div class="sarc">😏 ${s.sarc}</div>Why: ${s.why}<div class="btns"><button onclick="userSend('Got it')">✅ Got it, I made it</button><button class="black" onclick="userSend('45')">Q45 Stop</button><button class="black" onclick="userSend('10')">Q10 Robot</button></div>`,'','ernie-red');},900);}
function botReply(msg){
  const m=msg.toLowerCase().trim();
  if(["hi","molweni","dumela","hey","a","yebo","hello","sawubona","molo"].includes(m) || m.length<3){
    add(`A = Yebo, let's go 👋`);
    setTimeout(()=>{add(`<span class="hl-red">Sawubona! I'm Ernie</span> - Ernie's Driving School<br><br>I don't teach with books - I teach with <strong>your hands</strong>.<br><br>What we'll do:<br>🔴 <strong>Rope Knots:</strong> Yellow shoelace on door for yellow line<br>⚫ <strong>Cardboard Cut:</strong> Cut Stop sign (8 sides) from box<br>🟡 <strong>Poster / Mindmap:</strong> Draw mindmap on A4, stick on wall<br><br>Cost? <span class="hl">FREE</span> with sugar paper + koki<br>Or <span class="hl-red">buy printed R20</span> at Shoprite<br><br><strong>You asked: Can I learn K53 on Moya and will it be free?</strong><br><span class="hl-red">Yes, 100% free. 0KB. Moya pays, not you.</span>`,'','ernie-red');},700);
    setTimeout(()=>{add(`Start with?<br><br><strong>1 = Colours - Yellow line mindmap</strong><br><strong>2 = Road Signs - Cut Stop sign</strong><br><strong>3 = Rules - Rope knots</strong><br><strong>4 = Games? Yes - DIY with hands</strong><br><strong>5 = Jobs? Yes - Pass & get job</strong><br><strong>6 = Health? Safe driving</strong><br><strong>7 = Shopping? Rope + paper R2</strong><br><strong>8 = Education - Full 68 Qs</strong><br><br>Try <span class="hl">8</span> or <span class="hl">27</span>`);},1600);return;
  }
  if(m.includes("8")||m.includes("education")){add(`Sharp! 68 Qs ready. Start with hardest - fails 80%.`);setTimeout(()=>addStory("27"),800);return;}
  if(m.includes("27")||m.includes("yellow")||m.includes("1")){addStory("27");return;}
  if(m.includes("45")||m.includes("stop")||m.includes("2")){addStory("45");return;}
  if(m.includes("10")||m.includes("robot")||m.includes("3")){addStory("10");return;}
  if(m.includes("poster")||m.includes("mindmap")||m.includes("buy")){add(`<span class="hl-red">Posters - 2 options:</span><br><br><strong>1: FREE DIY</strong><br>A4/sugar paper + koki: Yellow line, Stop octagon, Traffic light.<br><br><strong>2: Buy printed R20</strong><br>Laminated A2, full colour, 68 Qs<br>Shoprite/Boxer<br>WhatsApp 071 123 4567`,'','ernie-red');return;}
  if(m.includes("got")||m.includes("made")||m.includes("done")){add(`<strong>🔥 Nice! Memory muscle!</strong><br>Touch it now say: <span class="hl-red">"Yellow = No Park"</span><br><br>Tomorrow hand touches door and brain says "Yellow line".<div class="btns"><button onclick="userSend('45')">Q45 Stop</button><button class="black" onclick="userSend('10')">Q10 Robot</button><button class="black" onclick="userSend('poster')">See posters</button></div>`,'','ernie-red');return;}
  const num=m.match(/\d+/); if(num && STORIES[num[0]]){addStory(num[0]);} else {add(`Type:<br><span class="hl">Hi</span> = Method (knots, cardboard, posters)<br><span class="hl">8</span> = 68 Qs<br><span class="hl">27</span> = Yellow line<br><span class="hl">poster</span> = Mindmaps R0/R20`);}
}
function userSend(text){if(!text)return;add(text,true);inp.value="";setTimeout(()=>botReply(text),500);}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=inp.value.trim();if(v)userSend(v);}});
window.onload=()=>{setTimeout(()=>{add(`A = Yebo, let's go`);},400);setTimeout(()=>{add(`Can I learn K53 on Moya and will it be free?`,true);},900);setTimeout(()=>{botReply("hi");},1500);};
</script>
</body>
</html>
