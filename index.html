<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernie's Driving School - Moya Demo</title>
<style>
:root{--red:#CC0000;--black:#111;--yellow:#FFEB00;}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Roboto,Arial;}
body{background:#111;max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#top{background:#111;color:white;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:5;}
#top .ava{width:42px;height:42px;background:white;border:2px solid var(--red);border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#top .ava img{width:100%;height:100%;object-fit:contain;}#top h2{flex:1;font-size:13px;font-weight:900;}#top h2 small{font-size:10px;color:#aaa;display:block;}
#chat{flex:1;overflow-y:auto;padding:12px;background:#111;display:flex;flex-direction:column;gap:12px;}
.bub{background:white;padding:13px 15px;border-radius:16px;max-width:92%;font-size:14.6px;line-height:1.5;box-shadow:0 3px 8px rgba(204,0,0,0.3);color:#111;align-self:flex-start;animation:pop .35s ease;border-left:5px solid var(--red);}
.bub.me{background:#DCF8C6;align-self:flex-end;border-left:5px solid #25D366;}
.bub.yellow{border-left:5px solid var(--yellow);background:#FFFDF0;}
.bub .time{font-size:11px;color:#666;margin-top:6px;display:block;}
.svg-box{background:white;border:3px solid #111;border-radius:14px;padding:12px;margin:10px 0;box-shadow:5px 5px 0 var(--red);}
.hl{background:var(--yellow);padding:3px 8px;border-radius:5px;font-weight:900;border:1px solid #111;display:inline-block;}
.hl-red{background:var(--red);color:white;padding:3px 8px;border-radius:5px;font-weight:900;display:inline-block;}
.sarc{font-style:italic;background:#FFF8E1;padding:9px 11px;border-left:5px solid var(--red);margin:9px 0;border-radius:0 12px 12px 0;}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.btns button{background:var(--red);color:white;border:2px solid var(--red);padding:12px 18px;border-radius:22px;font-size:13px;font-weight:800;cursor:pointer;}
.btns button.black{background:#111;color:var(--yellow);border-color:#111;}
.btns button.yellow{background:var(--yellow);color:#111;border-color:#111;}
.mindmap{background:linear-gradient(135deg,#fff 0%,#FFEB00 100%);border:3px solid #111;border-radius:14px;padding:12px;margin:10px 0;}
.science{background:#222;color:white;border:2px solid var(--red);border-radius:14px;padding:12px;margin:10px 0;}
.science h4{color:var(--yellow);font-size:13px;margin-bottom:6px;}
#inputBar{background:#222;padding:11px 12px;display:flex;align-items:center;gap:10px;border-top:3px solid var(--red);position:sticky;bottom:0;}
#inputBar input{flex:1;border:none;outline:none;font-size:15px;padding:9px;font-weight:600;background:transparent;color:white;}
#inputBar input::placeholder{color:#888;}
.icon{font-size:24px;color:white;cursor:pointer;}
@keyframes pop{0%{transform:scale(.92) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.path-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s ease forwards;}
.progress{height:6px;background:#333;border-radius:3px;overflow:hidden;margin:6px 0;}
.progress div{height:100%;background:linear-gradient(90deg,var(--red),var(--yellow));transition:width .4s;}
</style>
</head>
<body>
<div id="top"><div class="ava"><img src="./images/logo.png" onerror="this.innerHTML='🚗'"></div><h2>Ernie from Driving School<small id="locTag">Moya • 0KB • Personalized Demo</small></h2></div>
<div id="chat"></div>
<div id="inputBar"><span class="icon">☺</span><input id="inp" placeholder="Type here..."><span class="icon">📎</span><span class="icon">🎤</span></div>
<script>
const chat=document.getElementById('chat');const inp=document.getElementById('inp');const locTag=document.getElementById('locTag');
let userData=JSON.parse(localStorage.getItem('ernie_user')||'{}');
let step=0;let demoIdx=0;let mode='general';
const LOCATIONS=["Grabouw","Strand","Gordons Bay","Macassar","Sir Lowry's Pass","Somerset West","Kuils River"];

const Qs=[
{id:"27",t:"Q1/5: Solid Yellow Line (Hardest - 80% fail)",q:"In town, solid yellow line on edge - can you park for 2 mins to buy vetkoek? A) Yes B) No",diy:"ROPE KNOT: Yellow shoelace on door handle. Pull knot + say 'Yellow = No park, keep clear'",why:"Yellow = emergency lane - ambulance, taxi need clear",sarc:"Cousin says '2 mins' - officer writes R500 ticket in 2 mins. Fair trade?",svg:`<svg viewBox="0 0 320 90"><rect width="320" height="90" fill="#222"/><line x1="0" y1="65" x2="320" y2="65" stroke="#FFEB00" stroke-width="9" class="path-draw"/><text x="10" y="22" fill="white" font-size="11" font-weight="800">YELLOW LINE = KEEP CLEAR</text><rect x="210" y="12" width="90" height="28" rx="6" fill="#CC0000"/><text x="218" y="30" fill="white" font-size="10" font-weight="900">NO PARK!</text></svg>`,mindmap:"Yellow line → No park → No stop → R500 fine → Ambulance blocked"},
{id:"45",t:"Q2/5: Stop Sign - 8 Sides",q:"Stop sign has how many sides? A) 6 B) 8",diy:"CARDBOARD: Cut octagon from box, write STOP red, count 1-8 every morning",why:"8 sides so you know STOP even if word covered in mud",sarc:"Cousin says Stop = suggestion. Cousin failed 3 times. Don't be cousin.",svg:`<svg viewBox="0 0 200 130"><polygon points="100,10 150,30 150,85 100,105 50,85 50,30" fill="#CC0000" stroke="#111" stroke-width="4" class="path-draw"/><text x="100" y="68" text-anchor="middle" fill="white" font-weight="900" font-size="24">STOP</text><text x="100" y="122" text-anchor="middle" font-size="10" font-weight="800">8 SIDES - COUNT THEM!</text></svg>`,mindmap:"8 sides → Octagon → Even dirty → Still STOP → Count sides"},
{id:"10",t:"Q3/5: Robot Red+Yellow",q:"Robot shows Red + Yellow together - what do you do? A) Go fast B) Get ready, don't go yet",diy:"3 CUPS: Red cup STOP, Red+Yellow READY (clutch in), Green GO. Family shouts colours",why:"Red+Yellow = taxi saying 'Sharp I'm about to go!' Ready but don't move",sarc:"Not 'rev engine + check Facebook'. Phone waits, robot doesn't.",svg:`<svg viewBox="0 0 180 110"><rect x="60" width="60" height="100" rx="12" fill="#111"/><circle cx="90" cy="25" r="13" fill="#CC0000"/><circle cx="90" cy="52" r="13" fill="#FFEB00" stroke="white" stroke-width="3" class="path-draw"/><circle cx="90" cy="79" r="13" fill="#333"/><text x="90" y="108" text-anchor="middle" font-size="9" font-weight="900">READY - NOT GO!</text></svg>`,mindmap:"Red=Stop, Red+Yellow=Ready (clutch), Green=Go"},
{id:"33",t:"Q4/5: Mirror + Blind Spot",q:"Before turning right, check? A) Only mirror B) Mirror + blind spot (shoulder)",diy:"DOOR TOUCH: Touch left door handle = mirror, touch right shoulder = blind spot. Say 'Mirror-Shoulder'",why:"Taxi in blind spot = accident. Shoulder check saves life",sarc:"No shoulder check = surprise taxi passenger in your car. Free ride, but crash.",svg:`<svg viewBox="0 0 280 80"><rect width="280" height="80" fill="#eee"/><circle cx="60" cy="40" r="22" fill="#333"/><text x="60" y="44" text-anchor="middle" fill="white" font-size="7">YOU</text><rect x="130" y="20" width="30" height="15" fill="#888" rx="3"/><text x="145" y="55" text-anchor="middle" font-size="8">Mirror</text><path d="M82 40 L130 28" stroke="#CC0000" stroke-width="2" stroke-dasharray="4 4" class="path-draw"/><circle cx="220" cy="40" r="16" fill="#FFEB00" stroke="#111" stroke-width="2"/><text x="220" y="43" text-anchor="middle" font-size="6" font-weight="800">BLIND</text></svg>`,mindmap:"Mirror → Shoulder → Indicate → Turn → Safe"},
{id:"50",t:"Q5/5: Speed in Town",q:"In town, max speed unless sign says else? A) 60 B) 100",diy:"6 KNOTS: Tie 6 knots on rope for 60. Touch rope before starting car.",why:"Kids, dogs, gogos crossing in town = 60 saves lives",sarc:"100 in town = you arrive fast... at hospital. 60 = arrive alive.",svg:`<svg viewBox="0 0 200 80"><circle cx="100" cy="38" r="32" fill="white" stroke="#CC0000" stroke-width="6"/><text x="100" y="48" text-anchor="middle" font-size="26" font-weight="900">60</text><text x="100" y="75" text-anchor="middle" font-size="9" font-weight="800">MAX IN TOWN</text></svg>`,mindmap:"Town=60, Outside town=100, Highway=120, Learn 6 knots"}
];

function add(t,me=false,extra=""){const d=document.createElement('div');d.className='bub'+(me?' me':'')+' '+extra;const tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.innerHTML=t+`<span class="time">${tm}${me?' ✓✓':''}</span>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function progress(cur,tot){const p=document.createElement('div');p.className='progress';p.innerHTML=`<div style="width:${cur/tot*100}%"></div>`;chat.appendChild(p);chat.scrollTop=chat.scrollHeight;}
function save(){localStorage.setItem('ernie_user',JSON.stringify(userData));locTag.innerText=(userData.location||'Moya')+' • '+(userData.name||'0KB')+' • Personalized';}
function send(txt){if(!txt)return;add(txt,true);inp.value="";setTimeout(()=>handle(txt),600);}

function handle(msg){
 const m=msg.toLowerCase();
 if(step===0){
  add(`Sawubona! Welcome to Ernie's Driving School on Moya 🚗<br><br><span class="hl-red">0KB • Datafree • No airtime needed</span><br><br>I'm Ernie - I teach with hands, not books.<br><br>We use:<br>🔴 Rope knots for yellow lines<br>⚫ Cardboard Stop signs (8 sides)<br>🟡 Mindmap posters (R0 DIY or R20 buy)<br><br>First, let me know you - so I personalize for YOUR area.<br><br><strong>What's your name?</strong>`);
  step=1;return;
 }
 if(step===1){
  userData.name=msg.trim().split(' ')[0];save();
  add(`Sharp ${userData.name}! 👋 Saved.<br><br>Where are you from? I'll personalize for your area. Choose:`);
  let html=`<div class="btns">`;LOCATIONS.forEach(l=>{html+=`<button class="${l==='Strand'?'':'black'}" onclick="send('${l}')">${l}</button>`});html+=`</div>`;add(html);step=2;return;
 }
 if(step===2){
  userData.location=msg.trim();save();
  add(`Perfect - <span class="hl-red">${userData.location}</span>! I'll use local places you know.<br><br>If Strand: I'll use <span class="hl">circle near braai at Strand beach</span> as mental hook - you see it every weekend, you'll never forget.<br><br><strong>When is your birthday? (e.g. 15/06/2000)</strong> - for Code 8 age check`);
  step=3;return;
 }
 if(step===3){
  userData.dob=msg.trim();save();
  add(`Thank you ${userData.name} from ${userData.location}! ✅ Saved:<br>Name: ${userData.name}<br>Location: ${userData.location}<br>DOB: ${userData.dob}<br><br><span class="hl-red">HOW we learn - 14 Dimensions (Science):</span><div class="science"><h4>🧠 Why this works (not just reading)</h4>
    1. Visual - SVG draws itself<br>2. Kinesthetic - Rope knot on door<br>3. Verbal - Say "Yellow=No park" loud<br>4. Spatial - Poster on fridge<br>5. Personal - Your area ${userData.location}<br>6. Emotional - Sarcasm (cousin failed)<br>7. Social - Family shouts colours<br>8. Logical - Mindmap: Yellow→No park→Fine<br>9. Memory hook - Circle by braai = Stop<br>10. Repetition - Touch door daily<br>11. Context - Real Strand Main Rd<br>12. Humor - Vetkoek, cousin jokes<br>13. Reward - Got it button<br>14. Ownership - Make or buy poster R20</div>Ready for 5 DEMO Qs? General first, then personalized for ${userData.location}?<div class="btns"><button onclick="startDemo('general')">Yes - Start 5 Qs GENERAL</button></div>`);
  step=4;return;
 }
 if(step===4 || m.includes('general') || m.includes('start')){
  mode='general';demoIdx=0;step=5;startDemo();return;
 }
 if(step===5 || step===6){
  if(m.includes('got')||m.includes('next')||m.includes('continue')||m.includes('sharp')){
   demoIdx++;if(demoIdx<5){progress(demoIdx,5);showQ();}else{
    if(mode==='general'){
     add(`<span class="hl-red">✅ 5 GENERAL Qs DONE!</span><br>You saw: SVG animation, rope knot DIY, sarcasm, mindmap to deduce, poster R0/R20.<br><br>Now SAME 5 Qs but <strong>PERSONALIZED for ${userData.location}</strong><br><br>Example: Instead of "yellow line at Shoprite", I'll say "yellow line at Strand Main Rd by Wimpy, same as circle by braai you know". Your brain: "Ah! I know that place!" = hook.<div class="btns"><button class="yellow" onclick="startPersonalized()">Show PERSONALIZED for ${userData.location}</button></div>`);step=6;
    }else{
     add(`<span class="hl-red">🔥 PERSONALIZED DONE - See difference?</span><br><br><strong>General:</strong> "Yellow line = no park"<br><strong>Personalized Strand:</strong> "Yellow line at Strand Main Rd by Wimpy, like circle by braai you go Sunday - no park, braai blocked"<br><br>Same rule, YOUR memory = braai circle.<br><div class="science"><h4>Science Value for Moya</h4>
     <b>Mental Hook (Method of Loci):</b> Circle by braai you know → new info sticks to old memory<br>
     <b>Embodied:</b> Knot on YOUR door, not book<br>
     <b>Value:</b> User feels "Ernie knows Strand, not Joburg" → trust → buys poster R20 → passes → gets driver job → tells 5 friends → Moya growth<br>
     <b>Data Stored:</b> ${userData.name}, ${userData.location}, ${userData.dob} → next time "Sawubona ${userData.name} from ${userData.location}, ready for next 63 Qs?"<br>
     <b>14 Dimensions applied to each Q</b></div><div class="btns"><button onclick="send('restart')">Restart full journey</button><button class="black" onclick="send('buy')">Buy posters R20</button></div>`);step=7;
    }
   }
  }
 }
}

function startDemo(){mode='general';demoIdx=0;progress(0,5);showQ();}
function startPersonalized(){mode='personalized';demoIdx=0;progress(0,5);showQ();}

function showQ(){
 let q=Qs[demoIdx];
 let isPers=mode==='personalized';
 let title=q.t;
 let qText=q.q;let diy=q.diy;let why=q.why;let sarc=q.sarc;let svg=q.svg;let mindmap=q.mindmap;
 if(isPers && (userData.location||'').toLowerCase().includes('strand')){
  if(q.id==="27"){qText="In Strand Main Rd by Wimpy, yellow line - can you stop for fish & chips? A) Yes B) No";diy="STRAND HOOK: Yellow line at Strand Main Rd Wimpy - same line as circle by braai area. Tie shoelace + say 'Strand Main = No park'";why="Strand beachfront = ambulance needs clear for drownings. Fish & chips blocks ambulance.";sarc="Fish & chips 2 mins, ambulance 2 mins late - fish & chips not worth it, bra.";mindmap="Strand Main yellow → Same as braai circle → No park → Ambulance";svg=`<svg viewBox="0 0 340 95"><rect width="340" height="95" fill="#224477"/><text x="10" y="18" fill="#FFEB00" font-size="10" font-weight="800">STRAND - Main Rd by Wimpy / Circle by Braai</text><line x1="0" y1="70" x2="340" y2="70" stroke="#FFEB00" stroke-width="9" class="path-draw"/><circle cx="170" cy="40" r="18" fill="none" stroke="white" stroke-width="2" class="path-draw"/><text x="170" y="44" text-anchor="middle" fill="white" font-size="7">CIRCLE</text></svg>`;}
  if(q.id==="45"){qText="At Strand circle near braai, Stop sign - how many sides?";diy="STRAND CIRCLE: You know circle by braai at Strand beach? Stop sign there has 8 sides. Cut cardboard + put near your braai photo.";mindmap="Strand circle braai → Stop sign → 8 sides → Remember braai → Remember Stop";}
  if(q.id==="33"){qText="Turning to Strand beachfront, check?";diy="STRAND BLIND: In Strand, taxis come fast from beach road blind spot. Mirror + shoulder at circle.";}
 }
 let label=isPers?`PERSONALIZED for ${userData.location}`:`GENERAL (all SA)`;
 add(`<span class="hl-red">${label}</span> - <strong>${title}</strong><div class="svg-box">${svg}</div><span class="hl">${qText}</span>`);
 setTimeout(()=>{add(`<strong>DIY:</strong> ${diy}<div class="mindmap"><strong>🧠 Mindmap to deduce:</strong><br>${mindmap}</div><div class="sarc">😏 ${sarc}</div>Why: ${why}<div class="btns"><button onclick="send('Got it')">✅ Got it, I made it</button><button class="black" onclick="send('Next')">Next Q ${demoIdx+1}/5</button></div>`,'','yellow');},800);
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=inp.value.trim();if(v)send(v);}});
window.onload=()=>{setTimeout(()=>{handle('start');},600);};
</script>
</body>
</html>
